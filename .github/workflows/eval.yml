name: Agent Evaluation

on:
  pull_request:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ".[dev]"

      # Run eval framework tests (offline — no LLM calls)
      - name: Run eval framework tests
        run: pytest evals/ -v --tb=short

