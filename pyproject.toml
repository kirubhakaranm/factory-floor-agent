[project]
name = "factory-floor-agent"
version = "0.1.0"
description = "AI agents for PrimeEV Motors factory floor — diagnose, decide, and act"
requires-python = ">=3.11"
dependencies = [
    # Agent framework
    "google-adk>=1.2.0",
    "litellm>=1.50.0",
    "anthropic>=0.42.0",

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # Databases
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.14.0",
    "clickhouse-connect>=0.8.0",
    "chromadb>=0.5.0",

    # Streaming
    "confluent-kafka>=2.6.0",

    # RAG
    "sentence-transformers>=3.3.0",

    # Data generation
    "faker>=30.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",

    # Monitoring & logging
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",

    # Document parsing
    "pymupdf>=1.25.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]
